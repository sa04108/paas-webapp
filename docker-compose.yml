services:
    traefik:
        image: traefik:v3.6
        container_name: paas-proxy
        command:
            - '--providers.docker=true'
            - '--providers.docker.exposedbydefault=false'
            - '--providers.docker.constraints=Label(`paas.type`, `user-app`) || Label(`paas.type`, `core`)'
            - '--providers.docker.network=${APP_NETWORK:-paas-app}'
            - '--providers.file.directory=/traefik-dynamic'
            - '--providers.file.watch=true'
            # HTTP: Let's Encrypt HTTP-01 challenge 수신 및 HTTPS로 리다이렉트
            - '--entrypoints.web.address=:80'
            - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
            - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
            # HTTPS
            - '--entrypoints.websecure.address=:443'
            # 기본 TLS: tls 설정이 없는 라우터(유저 앱)는 아래 도메인의 인증서를 쓴다.
            # *.apps 와일드카드를 한 번만 발급해 공유하므로 앱 배포 시 개별 발급 대기가 없다.
            - '--entrypoints.websecure.http.tls.certresolver=letsencrypt'
            - '--entrypoints.websecure.http.tls.domains[0].main=apps.${PAAS_DOMAIN}'
            - '--entrypoints.websecure.http.tls.domains[0].sans=*.apps.${PAAS_DOMAIN}'
            # Let's Encrypt ACME (DNS-01 challenge via Cloudflare)
            # 자체 Cloudflare 존 도메인 전용: 포털·루트·*.apps 와일드카드
            - '--certificatesresolvers.letsencrypt.acme.dnschallenge=true'
            - '--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare'
            - '--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53'
            # 아웃바운드 53포트(UDP/DNS) 차단 환경을 우회하기 위해 엄격한 사전 DNS 전파 검증 생략
            - '--certificatesresolvers.letsencrypt.acme.dnschallenge.disablepropagationcheck=true'
            # 사전 검증 생략 대신 30초 대기 후 Let's Encrypt 검증 시도 (NPM과 동일한 방식)
            - '--certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=30'
            - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}'
            - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
            # Let's Encrypt ACME (HTTP-01 challenge) — 커스텀 도메인 전용.
            # 고객 도메인은 우리 Cloudflare 존 밖이라 DNS-01이 성립하지 않는다.
            # CNAME으로 트래픽이 이미 이 서버로 오므로 inbound 80 검증(HTTP-01)을 쓴다.
            # (acme.json은 리졸버 이름별로 키가 분리되어 두 리졸버가 공유해도 안전하다)
            - '--certificatesresolvers.letsencrypt-http.acme.httpchallenge=true'
            - '--certificatesresolvers.letsencrypt-http.acme.httpchallenge.entrypoint=web'
            - '--certificatesresolvers.letsencrypt-http.acme.email=${ACME_EMAIL}'
            - '--certificatesresolvers.letsencrypt-http.acme.storage=/letsencrypt/acme.json'
        environment:
            - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./portal-data/traefik-dynamic:/traefik-dynamic:ro
            - ./portal-data/letsencrypt:/letsencrypt
        networks:
            #            - proxy
            - paas-app
        restart: unless-stopped

    portal:
        build:
            context: .
            dockerfile_inline: |
                FROM node:22
                RUN curl -fsSL https://get.docker.com | sh
                RUN curl -sSL https://railpack.com/install.sh | sh
                WORKDIR ${PAAS_ROOT:-/paas}/portal
        image: paas-portal:local
        container_name: paas-portal
        working_dir: ${PAAS_ROOT:-/paas}/portal
        # If .env is missing, copy .env.example to bootstrap local runtime config.
        # start/dev is selected by RUN_MODE (development -> dev, otherwise start).
        command: sh -c "if [ ! -f ${PAAS_ROOT:-/paas}/.env ] && [ -f ${PAAS_ROOT:-/paas}/.env.example ]; then cp ${PAAS_ROOT:-/paas}/.env.example ${PAAS_ROOT:-/paas}/.env; fi; npm ci && if [ \"$$RUN_MODE\" = \"development\" ]; then npm run dev; else npm run start; fi"
        restart: ${DEFAULT_RESTART_POLICY:-unless-stopped}
        init: true
        ports:
            - '${PORTAL_PORT:-3000}:${PORTAL_PORT:-3000}'
        environment:
            - PAAS_HOST_ROOT=${PWD}
            # buildkit에 TCP가 아닌 공유 unix 소켓으로 접속한다 (buildkit-sock 볼륨).
            - BUILDKIT_HOST=unix:///run/buildkit/buildkitd.sock
        volumes:
            - './:${PAAS_ROOT:-/paas}'
            - 'portal_node_modules:${PAAS_ROOT:-/paas}/portal/node_modules'
            - /var/run/docker.sock:/var/run/docker.sock
            - buildkit-sock:/run/buildkit
        networks:
            - paas-app
        # buildkit 소켓이 준비된 뒤 포털이 기동하도록 순서를 명시한다.
        depends_on:
            - buildkit
        labels:
            - 'paas.type=core'
            - 'traefik.enable=true'
            # 포털: portal.{루트도메인} 에서 서빙
            - 'traefik.http.routers.portal.rule=Host(`portal.${PAAS_DOMAIN}`)'
            - 'traefik.http.routers.portal.entrypoints=websecure'
            - 'traefik.http.routers.portal.tls.certresolver=letsencrypt'
            - 'traefik.http.services.portal.loadbalancer.server.port=${PORTAL_PORT:-3000}'
            # 루트 도메인: 랜딩 페이지. 포털 컨테이너가 Host 기반으로 랜딩/포털을 분기 서빙한다.
            # (루트의 포털 UI 딥링크 → portal 서브도메인 301은 Express가 승계 — server.js 참고)
            - 'traefik.http.routers.portal-root.rule=Host(`${PAAS_DOMAIN}`)'
            - 'traefik.http.routers.portal-root.entrypoints=websecure'
            - 'traefik.http.routers.portal-root.tls.certresolver=letsencrypt'
            - 'traefik.http.routers.portal-root.service=portal'

    buildkit:
        image: moby/buildkit:latest
        container_name: paas-buildkit
        privileged: true
        restart: unless-stopped
        # TCP 리스너 제거: 테넌트가 도달 가능한 리스너를 없애고 unix 소켓만 남긴다.
        # 포털은 공유 볼륨(buildkit-sock)을 통해 이 소켓에 직접 접속한다.
        command:
            - '--addr=unix:///run/buildkit/buildkitd.sock'
        volumes:
            - buildkit-sock:/run/buildkit
        # 테넌트 네트워크(paas-app)에서 분리한다.
        # 베이스 이미지 pull(egress)만을 위한 전용 네트워크에만 연결한다.
        networks:
            - buildkit-net

networks:
    #    proxy:
    #        name: proxy
    paas-app:
        external: true
        name: ${APP_NETWORK:-paas-app}
    # buildkit 전용 egress 네트워크: 베이스 이미지 pull만을 위한 격리 네트워크.
    # 테넌트 앱은 이 네트워크에 없으므로 buildkit에 네트워크로 접근할 수 없다.
    buildkit-net:
        name: paas-buildkit-net

volumes:
    portal_node_modules:
    # buildkit unix 소켓을 portal과 공유하기 위한 볼륨 (TCP 대체).
    buildkit-sock:
