services:
  portal:
    # 개발용 직접 접속은 호스트 루프백에서만 허용한다.
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3000}:${PORTAL_PORT:-3000}"
    environment:
      - RUN_MODE=development
      - APP_HEALTH_DEV_ORIGIN=http://host.docker.internal:18080
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # dev 모드: ACME/HTTPS 없이 HTTP 전용으로 오버라이드
  # (localhost는 Let's Encrypt 인증서 발급 불가)
  traefik:
    image: traefik:v3.6
    container_name: paas-proxy
    networks:
      - paas-app
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`paas.type`, `user-app`)"
      - "--providers.docker.network=${APP_NETWORK:-paas-app}"
      - "--providers.file.directory=/traefik-dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "18080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portal-data/traefik-dynamic:/traefik-dynamic:ro

networks:
  paas-app:
    external: true
    name: ${APP_NETWORK:-paas-app}
