<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyunbbai Portal</title>
    <script>
      // 첫 렌더 전에 저장된 테마를 적용한다.
      document.documentElement.dataset.theme = "light";
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("paas-theme") === "dark" ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
