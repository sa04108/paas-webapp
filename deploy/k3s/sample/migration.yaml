apiVersion: batch/v1
kind: Job
metadata:
  generateName: prepare-
  namespace: paas-sample
  labels:
    app.kubernetes.io/name: paas-sample
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paas-sample
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              # 실제 DB 변경은 하지 않는다. 일회성 작업의 성공/실패 관문만 시연한다.
              test -n "$APP_LABEL"
              test -n "$DEMO_TOKEN"
              printf 'Preparing app=%s\n' "$APP_LABEL"
              sleep 2
              printf 'Preparation complete; no database was modified.\n'
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
