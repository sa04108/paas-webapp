# 컨트롤러·DNS·TLS Secret 준비 후 도메인을 수정해서 별도로 적용한다.
# 이 파일만 적용해도 Traefik이나 인증서 발급기가 설치되는 것은 아니다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: paas-sample
spec:
  ingressClassName: traefik
  tls:
    - hosts: [sample.example.com]
      secretName: sample-tls
  rules:
    - host: sample.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
