apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: paas-sample
  labels:
    app.kubernetes.io/name: paas-sample
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  minReadySeconds: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paas-sample
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paas-sample
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: paas-sample
              app.kubernetes.io/component: web
      containers:
        - name: web
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              printf 'PaaS k3s sample\napp=%s\npod=%s\n' "$APP_LABEL" "$POD_NAME" > /www/index.html
              printf 'ok\n' > /www/health
              exec httpd -f -p 5000 -h /www
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: www
              mountPath: /www
      volumes:
        - name: www
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: paas-sample
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paas-sample
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 5000
      targetPort: http
